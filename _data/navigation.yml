# The following is the order of the links in the header of the website.
#
# Changing the order here will adjust the order and you can also add additional
# links. Removing a link prevents it from showing in the header, but does not
# prevent it from being included in the site.
#
# The site title in the masthead already links home, so there is no "About"
# entry here: it would be the same destination twice.

main:
  - title: "Research"
    url: /research/

  - title: "Projects"
    url: /projects/

  - title: "CV"
    url: /cv/

# The Chinese pages use their own labels. The last two lead to pages that only
# exist in English, and say so: en: true renders the EN mark in the masthead.
zh:
  - title: "研究"
    url: /research/

  - title: "项目"
    url: /projects/
    en: true

  - title: "CV"
    url: /cv/
    en: true
